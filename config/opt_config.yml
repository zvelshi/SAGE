# --- GLOBAL OPTIMIZER ---
POP_SIZE: 75
N_OFFSPRINGS: 75
MAX_GEN: 40
M_PROB: 1.0
M_ETA: 15

# --- OBJECTIVES TO MINIMIZE ---
# target_* objectives run `scenario`, read `metric` at each swept step, and cost
# how far the metric drifts from a target curve:
#
#     cost = aggregate(metric(step) - target(x)) / cost_scale
#
# where `x` is the scenario's own sweep variable (rack travel, shock travel...).
# The four target types differ only in how the curve is built, each a narrower
# case of the one before it:
#
#   type: target_curve   points: [[x, y], ...]   piecewise-linear curve
#   type: target_range   min / max               line between the two sweep endpoints
#   type: target_const   const                   flat line at a constant
#   type: target_zero    (nothing extra)         flat line at 0
#
# limit / bound objectives instead keep a metric -- or one statistic of it over
# the sweep -- inside a band, costing only the spill-out:
#
#     cost = aggregate(max(0, min - v) + max(0, v - max)) / cost_scale
#
#   type: window    v = each step; must stay within [min, max]
#   type: ceiling   v must stay <= max
#   type: floor     v must stay >= min
#   type: limit     the general form: min and/or max, plus `stat`
#   stat            value (default) | max | min | mean | range | abs_max
#
# type: collision -- keepout-zone interference over `scenario`; zones/groups
#   come from KEEPOUT_ZONES / COLLISION_GROUPS below.
#
# Shared fields:
#   name        label in logs / Pareto plots               (default: the metric)
#   metric      toe_deg | camber_deg | caster_deg | kingpin_angle_deg |
#               caster_trail_mm | kingpin_offset_wc_mm | ackermann_pct |
#               track_change_mm | axle_plunge_mm | axle_angle_deg |
#               ground_clearance_mm | ... (any scalar or dotted step key)
#   scenario    travel | steer | droop_steer | jounce_steer | left_travel |
#               right_travel | sweep_space | front_steer | heave | roll
#   cost_scale  divisor on the aggregated error/violation  (default: 1.0)
#   aggregate   rmse | mean_abs | max_abs | max_abs_plus_range
#               (default: rmse for target_*, max_abs for limits)
OBJECTIVES:
  # Bump steer: toe angle stays flat at 0 through vertical travel.
  - name: BumpSteer
    type: target_zero
    metric: toe_deg
    scenario: travel
    aggregate: max_abs_plus_range
    cost_scale: 150.0

  # Ackermann: ackermann_pct stays at 0 across the steer sweep.
  - name: ParallelSteer
    type: target_zero
    metric: ackermann_pct
    scenario: front_steer
    cost_scale: 1400.0

  # Axle plunge stays within +-15 mm everywhere in the travel x steer sweep.
  - name: AxlePlunge
    type: window
    metric: axle_plunge_mm
    scenario: sweep_space
    min: -15.0
    max: 15.0
    cost_scale: 5.0

  # Peak CV joint angle stays under 30 deg across the travel x steer sweep.
  - name: AxleAngle
    type: ceiling
    metric: axle_angle_deg
    scenario: sweep_space
    stat: abs_max
    max: 30.0
    cost_scale: 5.0

  # Ground clearance must reach at least 406.4 mm somewhere in the heave sweep.
  - name: GroundClearance
    type: floor
    metric: ground_clearance_mm
    scenario: heave
    stat: max
    min: 406.4
    cost_scale: 50.0

  # Keepout-zone interference across the travel x steer sweep.
  - name: Interference
    type: collision
    scenario: sweep_space

# --- PARAMETERS TO OPTIMIZE ---
# Points are allowed to move within these bounded boxes.
FREE_POINTS:
  "tie_rod_inboard":
    x: [-50.0, 10.0]
    y: [-50.0, 50.0]
    z: [-40.0, 45.0]
  "tie_rod_outboard":
    x: [-20.0, 15.0]
    y: [-50.0, 50.0]
    z: [-50.0, 50.0]

# --- KEEPOUT ZONE ---
# These are shapes extruded along the axis between point_a -> point_b, used
# by `type: collision` objectives and the 3D config preview. >= 2 zones needed.
#   shape: "cylinder" -> dim1 = radius (mm)
#   shape: "box"      -> dim1 = side length 1 (mm), dim2 = side length 2 (mm)
KEEPOUT_ZONES:
  - name: "tierod"
    point_a: "tr_ib"
    point_b: "tr_ob"
    shape: "cylinder"
    dim1: 12.0
  - name: "upper_arm_f"
    point_a: "uf"
    point_b: "ubj"
    shape: "cylinder"
    dim1: 12.0
  - name: "upper_arm_r"
    point_a: "ur"
    point_b: "ubj"
    shape: "cylinder"
    dim1: 12.0

# --- COLLISION GROUPS (optional) ---
# These are zones within the SAME group are ALLOWED to overlap (their collision is ignored). 
# Every other pair -- zones in different groups, or an ungrouped zone vs anything -- IS 
# checked, and a collision there raises the cost. Also controls visualizer coloring. 
# Each group may hold up to 10 zones.
COLLISION_GROUPS:
  group1:
    - "tierod"
  group2:
    - "upper_arm_f"
    - "upper_arm_r"